[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grfnet"
description = "GRF-Net: a ROCKET-style fusion network for multichannel time series"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Kerry" }]
dynamic = ["version"]

dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
eeg = ["mne>=1.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.dynamic]
version = { attr = "grfnet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
