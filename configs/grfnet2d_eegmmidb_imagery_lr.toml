# GRFNet2d on EEGMMIDB imagined left versus right fist, 5-fold cross-subject.
# Log-power spectrograms per electrode: 0.4 s Hann windows (64 samples) every 0.1 s
# (16 samples), 0-40 Hz in 2.5 Hz bins. Dilations are along time, in frames.
# python -m grfnet.train configs/grfnet2d_eegmmidb_imagery_lr.toml
# Runs are named {model}_{dataset}_{task}: this one writes to runs/grfnet2d_eegmmidb_imagery_lr.

seed = 0

[data]
dataset = "eegmmidb"
task = "imagery_lr"
# All 109 subjects. Set root here or with GRFNET_EEGMMIDB.
tmin = 0.0
tmax = 4.0
sfreq = 160.0
cache_dir = "runs/cache"
normalize = "global"

[split]
scheme = "kfold"
n_folds = 5
val_fraction = 0.1

[model]
name = "GRFNet2d"
use_channel_names = false

[model.kwargs]
n_fft = 64
hop = 16
fmax = 40.0
kernel_size = [3, 5]
dilations = [1, 2, 4]

[training]
epochs = 100
batch_size = 64
lr = 0.001
weight_decay = 0.0001
scheduler = "cosine"
patience = 20
device = "auto"
amp = false
deterministic = false
