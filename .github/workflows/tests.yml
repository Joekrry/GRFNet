name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17"
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # CPU-only PyTorch/torchaudio avoids downloading the CUDA libraries and
      # keeps torchaudio's compiled extension built against the same torch ABI.
      - run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,eeg,onnx,viz,eval,baselines]"
      - run: python -m pytest
